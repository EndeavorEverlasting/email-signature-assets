name: Materialize Work cue bootstrap

on:
  push:
    branches:
      - feat/work-cue-v2-20260915

permissions:
  contents: write

concurrency:
  group: work-cue-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/work-cue-v2-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Generate and verify exact accepted cue
        run: |
          python scripts/generate_title_loading_gif.py
          python scripts/generate_title_loading_gif.py --verify-only
      - name: Commit generated bytes when needed
        shell: bash
        run: |
          if git diff --quiet -- Title_Loading_Ellipsis_Down.gif; then
            echo 'Generated bytes already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Title_Loading_Ellipsis_Down.gif
          git commit -m 'Regenerate accepted Work cue [skip ci]'
          git push origin HEAD:feat/work-cue-v2-20260915
